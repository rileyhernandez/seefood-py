
[project]
name = "seefood-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Explicitly pin to Python 3.11 so uv uses the stable ABI
requires-python = "==3.11.*"
dependencies = [
    "asyncio>=4.0.0",
    "flask>=3.1.2",
    "google-auth>=2.41.1",
    "openai>=2.2.0",
    "opencv-python>=4.12.0.88",
    "phidget22>=1.23.20250925",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "setuptools>=80.9.0",
    # Hardware-specific dependencies (Linux only)
    "gpiozero>=2.0.1; sys_platform == 'linux'",
    "lgpio>=0.2.2.0; sys_platform == 'linux'",
    "rpi-gpio>=0.7.1; sys_platform == 'linux'",
    "smbus2>=0.5.0; sys_platform == 'linux'",
    "sparkfun-qwiic-nau7802>=2.0.0; sys_platform == 'linux'",
    "vl53l0x; sys_platform == 'linux'",
]

[tool.uv.sources]
# Pull from GitHub instead of PyPI wheel (builds from source)
vl53l0x = { git = "https://github.com/Gadgetoid/VL53L0X-python.git" }
